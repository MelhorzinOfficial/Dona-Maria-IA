# ============================================
# Dona Maria IA - Production Docker Compose
# ============================================
# Usage:
#   docker-compose up -d --build
#
# Configure via .env file (copy from .env.example)
# ============================================

services:
 # ==========================================
 # Frontend - Next.js (Static + SSR)
 # ==========================================
 frontend:
  build:
   context: ./frontend
   dockerfile: Dockerfile
   args:
    - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-Dona Maria IA}
  image: dona-maria-ia-frontend:${APP_VERSION:-latest}
  container_name: dona-maria-frontend
  restart: unless-stopped
  ports:
   - '${FRONTEND_PORT:-3000}:3000'
  environment:
   - NODE_ENV=production
  depends_on:
   backend:
    condition: service_healthy
  networks:
   - dona-maria-network
  deploy:
   resources:
    limits:
     cpus: '1'
     memory: 512M
    reservations:
     cpus: '0.25'
     memory: 128M

 # ==========================================
 # Backend - FastAPI
 # ==========================================
 backend:
  build:
   context: ./backend
   dockerfile: Dockerfile
  image: dona-maria-ia-backend:${APP_VERSION:-latest}
  container_name: dona-maria-backend
  restart: unless-stopped
  ports:
   - '${BACKEND_PORT:-8000}:8000'
  environment:
   - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
   - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379
   - ENVIRONMENT=production
   - DEBUG=false
   - SECRET_KEY=${SECRET_KEY}
   - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000"]}
   - OPENAI_API_KEY=${OPENAI_API_KEY:-}
   - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
  depends_on:
   postgres:
    condition: service_healthy
   redis:
    condition: service_healthy
  networks:
   - dona-maria-network
  deploy:
   resources:
    limits:
     cpus: '2'
     memory: 1G
    reservations:
     cpus: '0.5'
     memory: 256M

 # ==========================================
 # PostgreSQL Database
 # ==========================================
 postgres:
  image: postgres:16-alpine
  container_name: dona-maria-postgres
  restart: unless-stopped
  ports:
   - '${POSTGRES_PORT:-5432}:5432'
  environment:
   - POSTGRES_USER=${POSTGRES_USER}
   - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
   - POSTGRES_DB=${POSTGRES_DB}
   - PGDATA=/var/lib/postgresql/data/pgdata
  volumes:
   - postgres_data:/var/lib/postgresql/data
  healthcheck:
   test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
   interval: 10s
   timeout: 5s
   retries: 5
   start_period: 10s
  networks:
   - dona-maria-network
  deploy:
   resources:
    limits:
     cpus: '1'
     memory: 512M
    reservations:
     cpus: '0.25'
     memory: 128M

 # ==========================================
 # Redis Cache
 # ==========================================
 redis:
  image: redis:7-alpine
  container_name: dona-maria-redis
  restart: unless-stopped
  ports:
   - '${REDIS_PORT:-6379}:6379'
  command: >
   redis-server
   --appendonly yes
   --maxmemory 256mb
   --maxmemory-policy allkeys-lru
   ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
  volumes:
   - redis_data:/data
  healthcheck:
   test: ['CMD', 'redis-cli', 'ping']
   interval: 10s
   timeout: 5s
   retries: 5
   start_period: 5s
  networks:
   - dona-maria-network
  deploy:
   resources:
    limits:
     cpus: '0.5'
     memory: 256M
    reservations:
     cpus: '0.1'
     memory: 64M

# ==========================================
# Volumes (Persistent Data)
# ==========================================
volumes:
 postgres_data:
  driver: local
 redis_data:
  driver: local

# ==========================================
# Networks
# ==========================================
networks:
 dona-maria-network:
  driver: bridge
