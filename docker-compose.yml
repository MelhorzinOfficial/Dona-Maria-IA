# ============================================
# Dona Maria IA - Docker Compose for Dokploy
# ============================================
# Optimized for deployment with Dokploy + Traefik
# Configure domains via Dokploy UI or Traefik labels
#
# Required: Set environment variables in Dokploy UI
# ============================================

services:
 # ==========================================
 # Frontend - Next.js (Static + SSR)
 # ==========================================
 frontend:
  build:
   context: ./frontend
   dockerfile: Dockerfile
   args:
    - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
    - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-Dona Maria IA}
  restart: unless-stopped
  expose:
   - '3000'
  environment:
   - NODE_ENV=production
  healthcheck:
   test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
   interval: 30s
   timeout: 10s
   retries: 3
   start_period: 40s
  networks:
   - dokploy-network

 # ==========================================
 # Backend - FastAPI
 # ==========================================
 backend:
  build:
   context: ./backend
   dockerfile: Dockerfile
  restart: unless-stopped
  expose:
   - '8000'
  environment:
   - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
   - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379
   - ENVIRONMENT=production
   - DEBUG=false
   - SECRET_KEY=${SECRET_KEY}
   - CORS_ORIGINS=${CORS_ORIGINS:-["https://donamaria.melhorzin.com"]}
   - OPENAI_API_KEY=${OPENAI_API_KEY:-}
   - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
  healthcheck:
   test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health")']
   interval: 30s
   timeout: 10s
   retries: 3
   start_period: 40s
  depends_on:
   postgres:
    condition: service_healthy
   redis:
    condition: service_healthy
  networks:
   - dokploy-network

 # ==========================================
 # PostgreSQL Database
 # ==========================================
 postgres:
  image: postgres:16-alpine
  restart: unless-stopped
  environment:
   - POSTGRES_USER=${POSTGRES_USER}
   - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
   - POSTGRES_DB=${POSTGRES_DB}
   - PGDATA=/var/lib/postgresql/data/pgdata
  volumes:
   - postgres_data:/var/lib/postgresql/data
  healthcheck:
   test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
   interval: 10s
   timeout: 5s
   retries: 5
   start_period: 10s
  networks:
   - dokploy-network

 # ==========================================
 # Redis Cache
 # ==========================================
 redis:
  image: redis:7-alpine
  restart: unless-stopped
  command: >
   redis-server
   --appendonly yes
   --maxmemory 256mb
   --maxmemory-policy allkeys-lru
   ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
  volumes:
   - redis_data:/data
  healthcheck:
   test: ['CMD', 'redis-cli', 'ping']
   interval: 10s
   timeout: 5s
   retries: 5
   start_period: 5s
  networks:
   - dokploy-network

# ==========================================
# Volumes (Persistent Data)
# ==========================================
volumes:
 postgres_data:
 redis_data:

# ==========================================
# Networks (Dokploy managed)
# ==========================================
networks:
 dokploy-network:
  external: true
